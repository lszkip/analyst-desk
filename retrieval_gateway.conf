# Fixed upstreams only: this is not a forward proxy. No credentials or source
# files are mounted here. Authentication remains enforced by each upstream.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 16m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Resolve on each cache expiry so container replacement is supported and
    # Qdrant can start before filings-kb has been created.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    server {
        listen 6333;
        # Gateway liveness only. /healthz still goes to the actual Qdrant server.
        location = /__gateway_health {
            default_type text/plain;
            return 200 "gateway ready\n";
        }
        location / {
            set $qdrant_upstream qdrant:6333;
            proxy_pass http://$qdrant_upstream;
        }
    }

    server {
        listen 8002;
        location / {
            set $kb_upstream filings-kb:8002;
            proxy_pass http://$kb_upstream;
        }
    }

    server {
        listen 8003;
        client_max_body_size 128k;
        location / {
            set $sandbox_upstream python-sandbox:8003;
            proxy_pass http://$sandbox_upstream;
        }
    }

    server {
        listen 8004;
        client_max_body_size 128k;
        location / {
            set $portal_upstream research-portal:8004;
            proxy_pass http://$portal_upstream;
        }
    }
}
