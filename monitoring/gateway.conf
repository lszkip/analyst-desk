worker_processes 1;
pid /tmp/monitoring-nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header Authorization "";
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8085;
        location = /__monitoring_health {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            limit_except GET { deny all; }
            default_type application/json;
            return 200 '{"status":"ok","service":"monitoring-gateway"}';
        }
        location / {
            limit_except GET { deny all; }
            set $exporter_backend exporter:8085;
            proxy_pass http://$exporter_backend;
        }
    }
    server {
        listen 9090;
        location / {
            limit_except GET { deny all; }
            set $prometheus_backend prometheus:9090;
            proxy_pass http://$prometheus_backend;
        }
    }
    server {
        listen 3000;
        # Grafana's read-only datasource query API requires POST.
        # Dashboard/datasource/user/annotation management writes remain denied.
        location = /api/ds/query {
            limit_except GET POST { deny all; }
            set $grafana_query_backend grafana:3000;
            proxy_pass http://$grafana_query_backend;
        }
        location / {
            limit_except GET { deny all; }
            set $grafana_backend grafana:3000;
            proxy_pass http://$grafana_backend;
        }
    }
}
