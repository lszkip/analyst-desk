global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: analyst-desk-saved-runs
    static_configs:
      - targets: ["exporter:8085"]
    metrics_path: /metrics
    honor_labels: false
    sample_limit: 2000
    label_limit: 12
    label_name_length_limit: 100
    label_value_length_limit: 200
