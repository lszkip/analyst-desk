name: Analyst Desk clean installation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Fresh runner, complete stack, synthetic fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned host preparation dependencies
        run: |
          python -m pip install -r requirements-retrieval.txt -r requirements-workflow.txt
          python -m pip check
          docker version
          docker compose version

      - name: Verify isolation, fixtures and cleanup safeguards offline
        run: python -m unittest -v deployment.test_ci_clean_install

      - name: Install and exercise production Compose stack
        env:
          ANALYST_CLEAN_RUNNER: ${{ runner.environment }}
        run: python -m deployment.ci_clean_install

      - name: Record actual scope and result
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('Clean_Install_Report.json')
          if not path.is_file():
              path.write_text(json.dumps({'schema_version':'clean-install-v1', 'status':'failed_before_launcher',
                  'performance_claim':False, 'scope':'CI dependency/setup phase did not complete'}, indent=2) + '\n')
          data = json.loads(path.read_text())
          data.pop('commands', None)
          text = json.dumps(data, indent=2)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Clean installation\n\nFresh runner with synthetic source fixtures and the production services. '
                           'This is installation/protocol evidence, not financial or agent-quality evidence.\n\n```json\n' + text + '\n```\n')
          PY

      - name: Preserve sanitized installation report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Clean_Installation_${{ github.run_id }}_${{ github.run_attempt }}
          path: Clean_Install_Report.json
          if-no-files-found: error
          retention-days: 14
