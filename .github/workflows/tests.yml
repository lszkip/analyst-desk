name: Analyst Desk tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The job only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-mcp.txt
            requirements-retrieval.txt
            requirements-tools.txt
            requirements-workflow.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-retrieval.txt -r requirements-workflow.txt
          python -m pip check

      - name: Run all offline tests, including MCP and retrieval contracts
        env:
          HF_HUB_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python -m unittest -v test_api.py test_financial_data.py test_edgar_mcp.py test_api_mcp.py test_filing_corpus.py test_filing_passages.py test_filing_supplements.py test_filing_retrieval.py test_retrieval_evaluation_metrics.py test_retrieval_rerank_fusion.py test_live_retrieval_parity.py test_filings_kb_mcp.py test_python_sandbox.py test_research_portal.py test_research_tools_mcp.py test_research_tools_setup.py test_research_workflow.py test_workflow_clients.py
